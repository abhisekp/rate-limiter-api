name: Release verification
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: release-candidates
          path: artifacts/*.tgz
  legacy-runtimes:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [6, 10, 18, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidates
          path: artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test the packed legacy artifact on older runtimes
        run: |
          mkdir -p build/legacy-consumer
          version=$(node -p "require('./packages/legacy/package.json').version")
          tar -xzf "artifacts/rate-limiter-api-$version.tgz" -C build/legacy-consumer
          node scripts/consumer-smoke.cjs build/legacy-consumer/package legacy
