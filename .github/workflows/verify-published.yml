name: Verify published npm releases
on:
  workflow_dispatch:
  push:
    branches: [master, 'fix/registry-propagation-checks']
    paths: ['scripts/registry-wait.mjs', 'scripts/verify-packages.mjs', '.github/workflows/verify-published.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install and test both public releases
        env:
          VERIFY_REGISTRY: '1'
          RELEASE_LINE: both
        run: npm run verify:packages
